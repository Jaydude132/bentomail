name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pipx install ruff
      - name: Check style
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with chart support
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[charts]" pytest
      - name: Run the test suite
        run: pytest -q

  minimal:
    name: Test without the charts extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the core package only
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Confirm matplotlib is absent
        run: |
          python -c "
          import importlib.util, sys
          if importlib.util.find_spec('matplotlib'):
              sys.exit('matplotlib should not be installed for this job')
          print('matplotlib is absent, as expected')
          "
      - name: Run the test suite
        run: pytest -q

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Verify metadata and README rendering
        run: twine check dist/*
      - name: Confirm the template is packaged
        run: |
          python -m zipfile -l dist/*.whl | grep -q "bentomail/templates/dashboard.jinja" \
            && echo "template present in wheel"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
